---
- name: Deploy bash configuration files
  hosts: all
  become: true

  tasks:

    - name: Install standard packages
      ansible.builtin.apt:
        name:
          - vim
          - git
          - bat
          - grc
          - jq
          - htop
          - curl
          - influxdb-client
          - lsof
          # - tldr
        state: present
        update_cache: true

    - name: Deploy user bash configuration files
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "/home/pi/{{ item | basename }}"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0644'
      loop:
        - ../bash/.ascii_nomic.txt
        - ../bash/.bash_aliases
        - ../bash/.bash_functions

    # - name: Ensure ~/.bash_functions is sourced in .bashrc
